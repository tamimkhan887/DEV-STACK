<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <script src="https://cdn.jsdelivr.net/npm/@tailwindcss/browser@4"></script>
    <title>Document</title>
</head>

<body class="container mx-auto">
    <header>
        <!-- Nav Bar Section -->
        <section>
            <nav class="flex justify-between items-center border border-[#F1F5F9] py-6 px-10">
                <div class="flex md:hidden">
                    <img src="./assets/hamburger.png" alt="">
                </div>
                <div>
                    <img src="./assets/logo-text.png" alt="">
                </div>
                <ul class="hidden md:flex items-center gap-6">
                    <li>Home</li>
                    <li>Technology</li>
                    <li>Projects</li>
                    <li>Contact</li>
                    <li>About</li>

                    next project.</p>
                <div class="space-x-3 mt-10">
                    <button class="bg-gradient-to-r from-[#F97316] to-[#EC4899] font-semibold text-white text-sm px-4 py-3 rounded-lg">Explore Technologies</button>
                    <button class="border border-[#E5E7EB] px-4 py-3 rounded-lg">Learn More</button>
                </div>
            </div>
            <div>
                <img src="./assets/banner-stack.png" alt="">
